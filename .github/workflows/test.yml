name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  posix-awk:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        run: sh tests/test_barcode_simulator.sh
